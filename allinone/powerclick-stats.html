<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>통나무 수집 통계</title>
  <script type="module" crossorigin src="/powerclick-stats.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill.js">
  <link rel="modulepreload" crossorigin href="/assets/auto.js">
  <link rel="modulepreload" crossorigin href="/assets/ColorExtractor.js">
  <link rel="modulepreload" crossorigin href="/assets/db.js">
  <link rel="modulepreload" crossorigin href="/assets/powerclick-db.js">
  <link rel="modulepreload" crossorigin href="/assets/chunk.js">
  <link rel="modulepreload" crossorigin href="/assets/browser-polyfill.js">
  <link rel="modulepreload" crossorigin href="/assets/StorageBridge.js">
  <link rel="stylesheet" crossorigin href="/assets/powerclick-stats.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- Global SVG Navbar Tabs -->
    <nav class="stats-nav">
      <a href="./powerclick-stats.html" class="nav-tab active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        통나무 수집 통계
      </a>
      <a href="./stream-stats.html" class="nav-tab">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        시청시간 & 품질
      </a>
    </nav>

    <!-- Header -->
    <header class="dashboard-header">
      <div class="header-title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        <h1>통나무 수집 통계</h1>
      </div>
      <div class="header-controls">
        <div class="range-picker">
          <button class="btn-range active" data-range="today">오늘</button>
          <button class="btn-range" data-range="week">이번 주</button>
          <button class="btn-range" data-range="month">이번 달</button>
          <button class="btn-range" data-range="all">전체</button>
        </div>
        <button id="btn-export" class="btn-action">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
          </svg>
          CSV 내보내기
        </button>
        <button id="btn-reset" class="btn-action danger">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          데이터 초기화
        </button>
      </div>
    </header>

    <!-- KPI Summary Grid -->
    <section class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-info">
          <p>오늘 수집 통나무</p>
          <h2 id="kpi-today">0</h2>
        </div>
        <div class="kpi-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-info">
          <p>이번 주 수집 통나무</p>
          <h2 id="kpi-week">0</h2>
        </div>
        <div class="kpi-icon blue">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-info">
          <p>이번 달 수집 통나무</p>
          <h2 id="kpi-month">0</h2>
        </div>
        <div class="kpi-icon purple">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-info">
          <p>전체 누적 통나무</p>
          <h2 id="kpi-total">0</h2>
        </div>
        <div class="kpi-icon pink">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
        </div>
      </div>
    </section>

    <!-- Analytics Charts -->
    <section class="charts-grid">
      <div class="chart-card">
        <div class="chart-header">
          <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
              <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
            기간별 클릭 추이
          </h3>
        </div>
        <div class="chart-container">
          <canvas id="trend-chart"></canvas>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-header">
          <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
              <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
            </svg>
            스트리머 수집 비중
          </h3>
        </div>
        <div class="chart-container">
          <canvas id="share-chart"></canvas>
        </div>
      </div>
    </section>

    <!-- Leaderboard Table -->
    <section class="section-card">
      <div class="table-header-toolbar">
        <h3>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/>
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/>
            <path d="M4 22h16"/>
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/>
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/>
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/>
          </svg>
          수집 리더보드
        </h3>
        <div class="search-input-wrapper">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="스트리머 채널 검색...">
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th data-sort="rank">순위</th>
              <th data-sort="name">스트리머 / 채널</th>
              <th data-sort="count">총 획득 통나무</th>
              <th data-sort="today">오늘 획득</th>
              <th>수집 점유율</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>
    </section>
  </div>

</body>
</html>
