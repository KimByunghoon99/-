<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시청시간 & 품질 분석</title>
  <script type="module" crossorigin src="/stream-stats.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill.js">
  <link rel="modulepreload" crossorigin href="/assets/auto.js">
  <link rel="modulepreload" crossorigin href="/assets/ColorExtractor.js">
  <link rel="modulepreload" crossorigin href="/assets/db.js">
  <link rel="modulepreload" crossorigin href="/assets/chunk.js">
  <link rel="modulepreload" crossorigin href="/assets/browser-polyfill.js">
  <link rel="modulepreload" crossorigin href="/assets/StorageBridge.js">
  <link rel="stylesheet" crossorigin href="/assets/powerclick-stats.css">
</head>

<body>
  <div class="dashboard-container">
    <!-- Global SVG Navbar Tabs -->
    <nav class="stats-nav">
      <a href="./powerclick-stats.html" class="nav-tab">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
          <line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        통나무 수집 통계
      </a>
      <a href="./stream-stats.html" class="nav-tab active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        시청시간 & 품질
      </a>
    </nav>

    <!-- Header -->
    <header class="dashboard-header">
      <div class="header-title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
        </svg>
        <h1>시청시간 & 품질 분석</h1>
      </div>
      <div class="header-controls">
        <div class="range-picker">
          <button class="btn-range active" data-range="today">오늘</button>
          <button class="btn-range" data-range="week">이번 주</button>
          <button class="btn-range" data-range="month">이번 달</button>
          <button class="btn-range" data-range="all">전체</button>
        </div>
        <button id="btn-export" class="btn-action">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3" />
          </svg>
          CSV 내보내기
        </button>
        <button id="btn-reset" class="btn-action danger">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          데이터 초기화
        </button>
      </div>
    </header>

    <!-- KPI Summary Grid -->
    <section class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-info">
          <p>오늘 시청 시간</p>
          <h2 id="kpi-watch-today">0분</h2>
        </div>
        <div class="kpi-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-info">
          <p>이번 주 시청 시간</p>
          <h2 id="kpi-watch-week">0분</h2>
        </div>
        <div class="kpi-icon blue">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
            <line x1="16" y1="2" x2="16" y2="6" />
            <line x1="8" y1="2" x2="8" y2="6" />
            <line x1="3" y1="10" x2="21" y2="10" />
          </svg>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-info">
          <p>평균 방송 지연</p>
          <h2 id="kpi-avg-latency">—</h2>
        </div>
        <div class="kpi-icon purple">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
          </svg>
        </div>
      </div>

      <div class="kpi-card">
        <div class="kpi-info">
          <p>평균 버퍼 안정도</p>
          <h2 id="kpi-avg-buffer">—</h2>
        </div>
        <div class="kpi-icon pink">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
          </svg>
        </div>
      </div>
    </section>

    <!-- Analytics Charts -->
    <section class="charts-grid">
      <div class="chart-card full-width">
        <div class="chart-header">
          <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
            시간대별 / 일별 시청 시간 추이
          </h3>
        </div>
        <div class="chart-container">
          <canvas id="trend-chart"></canvas>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-header">
          <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            스트리머별 평균 방송 지연 (Latency) & 버퍼
          </h3>
        </div>
        <div class="chart-container">
          <canvas id="quality-chart"></canvas>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-header">
          <h3>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
              <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
            </svg>
            스트리머 시청 시간 지분율
          </h3>
        </div>
        <div class="chart-container">
          <canvas id="watch-share-chart"></canvas>
        </div>
      </div>
    </section>

    <!-- Leaderboard Table -->
    <section class="section-card">
      <div class="table-header-toolbar">
        <h3>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9" />
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
          </svg>
          시청 & 품질 리더보드
        </h3>
        <div class="search-input-wrapper">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
          <input type="text" id="search-input" class="search-input" placeholder="스트리머 검색...">
        </div>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th data-sort="rank">순위</th>
              <th data-sort="name">스트리머 / 채널</th>
              <th data-sort="time">총 시청 시간</th>
              <th data-sort="latency">평균 지연율</th>
              <th data-sort="buffer">평균 버퍼</th>
              <th>주요 화질</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body">
            <!-- Dynamic rows -->
          </tbody>
        </table>
      </div>
    </section>
  </div>

</body>

</html>
